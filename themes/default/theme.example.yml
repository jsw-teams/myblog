name: default
description: Default blog theme example.
style: style.css
script: scripts/consent.js
templates: templates
i18n: i18n.yml

features:
  search: true
  lightbox: true
  media: true
  comments: true
  webMcp: true

featureScripts:
  search: scripts/search.js
  lightbox: scripts/lightbox.js
  media: scripts/media.js
  comments: scripts/comments.js
  webMcp: scripts/web-mcp.js

featureStyles:
  consent: styles/consent.css

featureCategories:
  search: necessary
  lightbox: necessary
  media: necessary
  comments: preferences
  webMcp: necessary

pagination:
  homePageSize: 8

icons:
  favicon: /favicon.ico
  icon32: /favicon-32x32.png
  appleTouchIcon: /apple-touch-icon.png
  icon192: /assets/icon-192.png
  icon512: /assets/icon-512.png
  manifest: /site.webmanifest

head:
  meta:
    - name: theme-color
      content: "#141414"
      enabled: true
  links:
    - rel: preconnect
      href: https://static.cloudflareinsights.com
      enabled: false

nav:
  links:
    - key: home
      href: /:locale/
      label:
        zh-CN: 首页
        zh-TW: 首頁
        en: Home
    - key: archive
      href: /:locale/archive/
      enabled: true
      label:
        zh-CN: 归档
        zh-TW: 歸檔
        en: Archive
    - key: categories
      href: /:locale/categories/
      enabled: true
      label:
        zh-CN: 分类
        zh-TW: 分類
        en: Categories
    - key: tags
      href: /:locale/tags/
      enabled: true
      label:
        zh-CN: 标签
        zh-TW: 標籤
        en: Tags
    - key: about
      href: /:locale/about/
      enabled: true
      label:
        zh-CN: 关于
        zh-TW: 關於
        en: About
  utilityLinks:
    - key: search
      href: /:locale/search/
      icon: ⌕
      enabled: true
      label:
        zh-CN: 搜索
        zh-TW: 搜尋
        en: Search

plugins:
  comments:
    provider: twikoo
    envId: https://api-comments.example.com
    script: https://example.com/twikoo.min.js
  analytics:
    cloudflareWebAnalytics:
      enabled: false
      src: https://static.cloudflareinsights.com/beacon.min.js
      token: YOUR_CLOUDFLARE_WEB_ANALYTICS_TOKEN
      defer: true
      consent: analytics
      beacon:
        spa: false
