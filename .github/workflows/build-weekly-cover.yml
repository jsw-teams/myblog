name: Build weekly news cover from sourced photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-weekly-cover.yml"
      - "scripts/news-cover/build-2026-08-10-16.mjs"

permissions:
  contents: write

jobs:
  build-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download, compose, and validate real-source cover
        run: node scripts/news-cover/build-2026-08-10-16.mjs
      - name: Commit final cover only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static/assets/blog-media/global-news-2026-08-10-16-cover.jpg
          if git diff --cached --quiet; then
            echo "No cover changes to commit"
            exit 0
          fi
          git commit -m "更新 2026-08-10 至 08-16 真实素材新闻封面"
          git push
