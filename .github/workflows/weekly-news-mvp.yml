name: Weekly News MVP

on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Optional ISO date used to calculate the previous Taipei week"
        required: false
        type: string
  schedule:
    # Mondays at 09:30 Asia/Taipei.
    - cron: "30 1 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-news-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MYFILES_PUBLIC_BASE: https://files.js.gripe
      MYFILES_ASSET_MANIFEST: config/news-mvp.assets.json
      NEWS_MVP_REFERENCE_DATE: ${{ github.event.inputs.reference_date || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly news draft
        run: node scripts/news-mvp/generate-weekly-news.mjs

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Open draft pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Generate weekly news MVP draft"
          branch: automation/weekly-news-mvp
          delete-branch: true
          draft: true
          title: "Weekly News MVP draft"
          body: |
            Generated by the Weekly News MVP workflow.

            - Calculates the previous week in Asia/Taipei.
            - Writes a draft zh-CN post under content/posts/.
            - Keeps myfiles attachments as manifest-backed placeholders.
            - Runs npm run build and npm run check before opening this PR.
