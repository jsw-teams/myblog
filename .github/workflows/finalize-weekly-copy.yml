name: Finalize weekly news copy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-weekly-copy.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace ambiguous phrasing and clarify image attribution
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('content/posts/global-news-2026-08-10-16/index.zh-TW.md'),
              Path('content/posts/global-news-2026-08-10-16/index.zh-SG.md'),
              Path('content/posts/global-news-2026-08-10-16/index.en.md'),
          ]

          replacements = {
              files[0]: [
                  (
                      '中華民國總統府的2026年城鎮韌性演習現場照片（[來源與政府資料開放授權聲明](https://www.president.gov.tw/Page/18)）',
                      '中華民國總統府的2026年城鎮韌性演習現場照片（[原始照片](https://www.president.gov.tw/img/Image/8ad6f652-23d0-408d-8c3a-e27f85ec8c4b.jpg)；[政府資料開放授權聲明](https://www.president.gov.tw/Page/18)）'
                  ),
                  (
                      '這些科目把臺灣的防衛準備從「部隊能不能打」推進到「通訊、醫療、交通與政府服務在受攻擊後能不能繼續運轉」。真正被測試的是整個社會在低頻寬、交通受限與資訊混亂狀態下的持續運作能力。',
                      '這些科目把臺灣防衛準備的評估範圍，從部隊作戰能力擴大到受攻擊後通訊、醫療、交通與政府服務的持續運轉能力；整個社會在低頻寬、交通受限與資訊混亂狀態下的連續運作，已經成為正式演練項目。'
                  ),
              ],
              files[1]: [
                  (
                      '中华民国总统府的2026年城镇韧性演习现场照片（[来源与政府资料开放授权声明](https://www.president.gov.tw/Page/18)）',
                      '中华民国总统府的2026年城镇韧性演习现场照片（[原始照片](https://www.president.gov.tw/img/Image/8ad6f652-23d0-408d-8c3a-e27f85ec8c4b.jpg)；[政府资料开放授权声明](https://www.president.gov.tw/Page/18)）'
                  ),
                  (
                      '这些科目把台湾的防卫准备从“部队能不能打”推进到“通信、医疗、交通和政府服务在受攻击后能不能继续运行”。真正被测试的是整个社会在低带宽、交通受限和信息混乱状态下的持续运作能力。',
                      '这些科目把台湾防卫准备的评估范围，从部队作战能力扩大到受攻击后通信、医疗、交通和政府服务的持续运行能力；整个社会在低带宽、交通受限和信息混乱状态下的连续运作，已经成为正式演练项目。'
                  ),
              ],
              files[2]: [
                  (
                      'a 2026 Taiwan urban-resilience exercise photograph from the Office of the President ([source and Taiwan Open Government Data License notice](https://www.president.gov.tw/Page/18))',
                      'a 2026 Taiwan urban-resilience exercise photograph from the Office of the President ([original photograph](https://www.president.gov.tw/img/Image/8ad6f652-23d0-408d-8c3a-e27f85ec8c4b.jpg); [Taiwan Open Government Data License notice](https://www.president.gov.tw/Page/18))'
                  ),
              ],
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements[path]:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          banned = ['封面圖片由本站本地媒體庫提供', '封面图片由本站本地媒体库提供']
          for path in files:
              text = path.read_text(encoding='utf-8')
              for phrase in banned:
                  if phrase in text:
                      raise SystemExit(f'Banned implementation note remains in {path}')
          for path in files[:2]:
              text = path.read_text(encoding='utf-8')
              if '能否' in text or '能不能' in text:
                  raise SystemExit(f'Ambiguous question phrasing remains in {path}')
          PY
      - name: Commit copy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/global-news-2026-08-10-16/
          git commit -m "清理周报模糊问句与封面来源标注"
          git push
