name: Finalize weekly news copy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-weekly-copy.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining ambiguous conditional phrasing
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('content/posts/global-news-2026-08-10-16/index.zh-TW.md'): (
                  '這次地震發生在Flores back-arc thrust相關構造帶，印尼本來就處在高地震風險區，但真正決定死亡與恢復速度的不是震級單一數字，而是道路、港口、醫療與通訊能否保持可達。',
                  '這次地震發生在Flores back-arc thrust相關構造帶，印尼本來就處在高地震風險區。死亡與恢復速度更直接取決於道路、港口、醫療與通訊的可達程度，單一震級數字無法概括救援條件。'
              ),
              Path('content/posts/global-news-2026-08-10-16/index.zh-SG.md'): (
                  '这次地震发生在Flores back-arc thrust相关构造带。印度尼西亚本来就处于高地震风险区，但真正决定死亡与恢复速度的不是震级单一数字，而是道路、港口、医疗与通信是否保持可达。',
                  '这次地震发生在Flores back-arc thrust相关构造带，印度尼西亚本来就处于高地震风险区。死亡与恢复速度更直接取决于道路、港口、医疗与通信的可达程度，单一震级数字无法概括救援条件。'
              ),
              Path('content/posts/global-news-2026-08-10-16/index.en.md'): (
                  "Indonesia's underlying seismic risk is familiar, but casualty and recovery outcomes are determined less by the magnitude number alone than by whether roads, ports, hospitals and communications remain reachable.",
                  "Indonesia's underlying seismic risk is familiar. Casualty and recovery outcomes depend heavily on the accessibility of roads, ports, hospitals and communications; the magnitude number alone does not capture relief conditions."
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          for path in list(replacements)[:2]:
              text = path.read_text(encoding='utf-8')
              for phrase in ('能否', '能不能', '或許', '或许'):
                  if phrase in text:
                      raise SystemExit(f'Ambiguous phrase {phrase} remains in {path}')
          PY
      - name: Commit final copy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/global-news-2026-08-10-16/
          git commit -m "移除周报最后的模糊条件句"
          git push
